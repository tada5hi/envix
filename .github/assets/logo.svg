<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eb-title">
    <title id="eb-title">envix logo: a .env file whose string values turn into a number, a boolean and a list</title>
    <defs>
        <linearGradient id="eb-page" x1="44" y1="20" x2="212" y2="236" gradientUnits="userSpaceOnUse">
            <stop stop-color="#22C55E" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#15803D" stop-opacity="0.2"/>
        </linearGradient>
    </defs>

    <!-- the page with a folded corner -->
    <path d="M58 20 H170 L214 64 V220 C214 229 207 236 198 236 H58 C49 236 42 229 42 220 V36 C42 27 49 20 58 20 Z" fill="url(#eb-page)" stroke="#16A34A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 20 V52 C170 59 175 64 182 64 H214" stroke="#16A34A" stroke-width="3" stroke-linejoin="round" fill="#22C55E" fill-opacity="0.18"/>

    <!-- lines: KEY = value -->
    <g fill="#16A34A">
        <rect x="64" y="88" width="46" height="14" rx="7"/>
        <rect x="64" y="134" width="58" height="14" rx="7"/>
        <rect x="64" y="180" width="38" height="14" rx="7"/>
    </g>
    <g stroke="#16A34A" stroke-width="4" stroke-linecap="round">
        <path d="M120 91 H132 M120 99 H132"/>
        <path d="M132 137 H144 M132 145 H144"/>
        <path d="M112 183 H124 M112 191 H124"/>
    </g>

    <!-- number value -->
    <g>
        <rect x="142" y="80" width="52" height="30" rx="9" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2.5"/>
        <path d="M159 88 L165 84 V104" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M173 88 C173 85 176 84 179 84 C182 84 185 86 185 89 C185 95 173 98 173 104 H186" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" repeatCount="1" fill="freeze"/>
    </g>
    <!-- boolean value -->
    <g>
        <rect x="152" y="126" width="48" height="30" rx="15" fill="#22C55E" fill-opacity="0.25" stroke="#22C55E" stroke-width="2.5"/>
        <circle cx="185" cy="141" r="9" fill="#22C55E">
            <animate attributeName="cx" values="167;185" dur="0.5s" begin="0.9s" repeatCount="1" fill="freeze"/>
        </circle>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" repeatCount="1" fill="freeze"/>
    </g>
    <!-- array value -->
    <g>
        <rect x="132" y="172" width="62" height="30" rx="9" fill="#D946EF" fill-opacity="0.2" stroke="#D946EF" stroke-width="2.5"/>
        <path d="M145 179 H140 V195 H145 M181 179 H186 V195 H181" stroke="#D946EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="153" cy="187" r="4" fill="#D946EF"/>
        <circle cx="163" cy="187" r="4" fill="#D946EF"/>
        <circle cx="173" cy="187" r="4" fill="#D946EF"/>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1s" repeatCount="1" fill="freeze"/>
    </g>
</svg>
